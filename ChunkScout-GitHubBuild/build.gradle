plugins {
    id 'fabric-loom' version '1.14.5'
    id 'maven-publish'
}

group = 'com.chunkscout'
version = '1.0.0'

base { archivesName = 'chunkscout-1.21.11' }

repositories { maven { url = 'https://maven.fabricmc.net/' } }

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.6:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }

tasks.jar { from('LICENSE') { rename { "${it}_" } } }
